name: Feature request
description: Suggest a new feature, prompt, agent, or Skill for this demo repo.
title: "feat: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. This template helps scope the request so it
        can be assigned to either a human contributor or `@copilot` cleanly.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      placeholder: Describe the gap or pain point.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      placeholder: What should this repo do that it currently doesn't?
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkboxes a contributor or `@copilot` can tick off when done.
      value: |
        - [ ]
        - [ ]
        - [ ] Playwright coverage added if user-facing.
        - [ ] No new dependencies.
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this feature should NOT do.
    validations:
      required: false

  - type: dropdown
    id: copilot-ready
    attributes:
      label: Is this safe to assign to `@copilot`?
      options:
        - "Yes — well-scoped, no architectural decisions required"
        - "No — needs human discussion first"
        - "Unsure"
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's [Code of Conduct](../blob/main/CODE_OF_CONDUCT.md).
          required: true
