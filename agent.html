<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>What Is An Agent - Image Showcase</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #0b0f19;
        display: grid;
        place-items: center;
      }

      main {
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: center;
      }

      img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
    </style>
  </head>
  <body>
    <main>
      <img
        src="images/agent.png"
        alt="What Is An Agent visual"
        aria-label="Agent diagram displayed at maximum viewport size"
      />
    </main>
  </body>
</html>
