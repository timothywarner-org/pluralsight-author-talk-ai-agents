<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirmed &middot; AI Skill Path Picker</title>
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <header class="site-header">
    <h1>You're enrolled.</h1>
    <p class="tagline">Watch your inbox for the kickoff email.</p>
  </header>

  <main>
    <section class="confirmation" data-testid="confirmation">
      <p>Path: <strong data-testid="confirm-path">&mdash;</strong></p>
      <p>Name: <strong data-testid="confirm-name">&mdash;</strong></p>
      <p>Email: <strong data-testid="confirm-email">&mdash;</strong></p>
      <p>Role: <strong data-testid="confirm-role">&mdash;</strong></p>
      <a href="index.html" class="cta" data-testid="back-home">Pick another path</a>
    </section>
  </main>

  <footer>
    <p>Built for the Pluralsight Author Talk series.</p>
  </footer>

  <script src="scripts/confirm.js"></script>
</body>
</html>
