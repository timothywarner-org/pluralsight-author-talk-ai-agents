<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="AI Agents Author Talk -- M365 Copilot, Claude Code, GitHub Copilot. Tim Warner, Pluralsight.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0L0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.6"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)" opacity="0.55"/>

  <!-- accent stripe -->
  <rect x="0" y="0" width="6" height="320" fill="url(#accent)"/>
  <rect x="40" y="296" width="280" height="3" fill="url(#accent)" opacity="0.85"/>

  <!-- title block -->
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" fill="#e6edf3">
    <text x="40" y="78" font-size="20" letter-spacing="6" fill="#7d8590">PLURALSIGHT AUTHOR TALK</text>
    <text x="40" y="148" font-size="56" font-weight="800" letter-spacing="-1">AI Agents in Practice</text>
    <text x="40" y="195" font-size="26" font-weight="500" fill="#c9d1d9">
      <tspan fill="#58a6ff">M365 Copilot</tspan>
      <tspan fill="#7d8590"> &#183; </tspan>
      <tspan fill="#a371f7">Claude Code</tspan>
      <tspan fill="#7d8590"> &#183; </tspan>
      <tspan fill="#3fb950">GitHub Copilot</tspan>
    </text>
    <text x="40" y="248" font-size="16" fill="#8b949e">Subagents &#183; Skills &#183; Plugins &#183; Custom agents &#183; Agentic loops</text>
    <text x="40" y="285" font-size="16" fill="#c9d1d9" font-weight="600">Tim Warner
      <tspan fill="#7d8590" font-weight="400"> &#183; Microsoft MVP &#183; 200+ Pluralsight courses &#183; 1M+ learners</tspan>
    </text>
  </g>

  <!-- right-side terminal mockup -->
  <g transform="translate(760 60)">
    <rect width="400" height="220" rx="10" fill="#0b0f14" stroke="#30363d" stroke-width="1"/>
    <!-- traffic lights -->
    <circle cx="20" cy="20" r="6" fill="#f85149"/>
    <circle cx="40" cy="20" r="6" fill="#d29922"/>
    <circle cx="60" cy="20" r="6" fill="#3fb950"/>
    <text x="200" y="25" font-family="'Cascadia Code', 'Consolas', monospace" font-size="11" fill="#7d8590" text-anchor="middle">~/repo &#8212; claude</text>

    <g font-family="'Cascadia Code', 'Consolas', monospace" font-size="13">
      <text x="20" y="65" fill="#58a6ff">&gt;</text>
      <text x="40" y="65" fill="#e6edf3">@copilot</text>
      <text x="115" y="65" fill="#a371f7">solve</text>
      <text x="160" y="65" fill="#e6edf3">#42</text>

      <text x="20" y="95" fill="#7d8590">&#9783; routing to</text>
      <text x="125" y="95" fill="#3fb950">test-writer</text>

      <text x="20" y="120" fill="#7d8590">&#9783; routing to</text>
      <text x="125" y="120" fill="#d29922">qa-reviewer</text>

      <text x="20" y="145" fill="#7d8590">&#9783; routing to</text>
      <text x="125" y="145" fill="#f85149">security-reviewer</text>

      <text x="20" y="180" fill="#3fb950">&#10003; PR opened</text>
      <text x="125" y="180" fill="#7d8590">&#183; tests green</text>
      <text x="20" y="200" fill="#3fb950">&#10003; review approved</text>
      <text x="20" y="220" filter="url(#glow)" fill="#58a6ff">_</text>
    </g>
  </g>
</svg>
