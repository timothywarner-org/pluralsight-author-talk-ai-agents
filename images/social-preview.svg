<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="AI Agents in Practice -- Pluralsight Author Talk by Tim Warner. M365 Copilot, Claude Code, GitHub Copilot. Subagents, skills, plugins, custom agents, agentic loops.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6edf3"/>
      <stop offset="1" stop-color="#c9d1d9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0L0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.6"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a371f7" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.55"/>
  <ellipse cx="960" cy="430" rx="420" ry="360" fill="url(#halo)"/>

  <!-- accent stripe -->
  <rect x="0" y="0" width="8" height="640" fill="url(#accent)"/>

  <!-- title block -->
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif">
    <text x="72" y="118" font-size="22" letter-spacing="7" fill="#7d8590">PLURALSIGHT AUTHOR TALK</text>

    <text x="72" y="212" font-size="84" font-weight="800" letter-spacing="-2" fill="url(#title)">AI Agents</text>
    <text x="72" y="300" font-size="84" font-weight="800" letter-spacing="-2" fill="url(#title)">in Practice</text>

    <rect x="74" y="332" width="300" height="4" fill="url(#accent)" opacity="0.9"/>

    <text x="72" y="392" font-size="30" font-weight="600">
      <tspan fill="#58a6ff">M365 Copilot</tspan>
      <tspan fill="#7d8590"> &#183; </tspan>
      <tspan fill="#a371f7">Claude Code</tspan>
      <tspan fill="#7d8590"> &#183; </tspan>
      <tspan fill="#3fb950">GitHub Copilot</tspan>
    </text>

    <text x="72" y="436" font-size="19" fill="#8b949e">Subagents &#183; Skills &#183; Plugins &#183; Custom agents &#183; Agentic loops</text>
  </g>

  <!-- author footer -->
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif">
    <rect x="72" y="540" width="48" height="48" rx="10" fill="url(#accent)"/>
    <text x="96" y="572" font-size="24" font-weight="800" fill="#0d1117" text-anchor="middle">TW</text>
    <text x="136" y="562" font-size="22" font-weight="700" fill="#e6edf3">Tim Warner</text>
    <text x="136" y="584" font-size="15" fill="#7d8590">Microsoft MVP &#183; 200+ Pluralsight courses &#183; 1M+ learners</text>
  </g>

  <!-- right-side terminal mockup -->
  <g transform="translate(792 188)">
    <rect width="416" height="264" rx="12" fill="#0b0f14" stroke="#30363d" stroke-width="1"/>
    <!-- traffic lights -->
    <circle cx="22" cy="24" r="6.5" fill="#f85149"/>
    <circle cx="44" cy="24" r="6.5" fill="#d29922"/>
    <circle cx="66" cy="24" r="6.5" fill="#3fb950"/>
    <text x="208" y="29" font-family="'Cascadia Code', 'Consolas', monospace" font-size="12" fill="#7d8590" text-anchor="middle">~/repo &#8212; claude</text>
    <line x1="0" y1="44" x2="416" y2="44" stroke="#30363d" stroke-width="1"/>

    <g font-family="'Cascadia Code', 'Consolas', monospace" font-size="14">
      <text x="22" y="80" fill="#58a6ff">&gt;</text>
      <text x="44" y="80" fill="#e6edf3">@copilot</text>
      <text x="132" y="80" fill="#a371f7">solve</text>
      <text x="186" y="80" fill="#e6edf3">#42</text>

      <text x="22" y="116" fill="#7d8590">&#9783; routing to</text>
      <text x="142" y="116" fill="#3fb950">test-writer</text>

      <text x="22" y="144" fill="#7d8590">&#9783; routing to</text>
      <text x="142" y="144" fill="#d29922">qa-reviewer</text>

      <text x="22" y="172" fill="#7d8590">&#9783; routing to</text>
      <text x="142" y="172" fill="#f85149">security-reviewer</text>

      <text x="22" y="212" fill="#3fb950">&#10003; PR opened</text>
      <text x="142" y="212" fill="#7d8590">&#183; tests green</text>
      <text x="22" y="236" fill="#3fb950">&#10003; review approved</text>
      <text x="142" y="236" fill="#58a6ff" filter="url(#glow)">_</text>
    </g>
  </g>
</svg>
